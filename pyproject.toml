[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwencode-branch-stats"
version = "0.24.0.2"
description = "Local Qwen Code usage metrics by Git repository and branch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "qwencode-branch-stats contributors" }
]
keywords = [
  "qwen",
  "qwen-code",
  "cli",
  "git",
  "statistics",
  "metrics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/helhrave/qwencode-branch-stats"
Repository = "https://github.com/helhrave/qwencode-branch-stats"
Issues = "https://github.com/helhrave/qwencode-branch-stats/issues"

[project.scripts]
qwencode-branch-stats = "qwencode_branch_stats.cli:main"
qbs = "qwencode_branch_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
